<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=League+Spartan:wght@700;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="./auth.js"></script>
  <style>
    :root { --azul:#1F6DB1; --azul-claro:#D1E3F6; --naranja:#E87722; --gris:#53565A; --bg:#f4f8fd; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Montserrat',sans-serif; background:var(--bg); color:var(--gris); min-height:100vh; padding:40px 24px 70px; }
    .page { max-width:1100px; margin:0 auto; }

    .back-link { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--azul); text-decoration:none; margin-bottom:24px; padding:6px 12px; background:white; border-radius:6px; box-shadow:0 1px 6px rgba(31,109,177,.1); transition:all .2s; }
    .back-link:hover { background:var(--azul); color:white; }

    .header { text-align:center; margin-bottom:48px; }
    .brand-row { display:flex; align-items:center; justify-content:center; gap:22px; margin-bottom:20px; }
    .brand-logo { height:84px; display:block; }
    .brand-divider { width:2px; height:64px; background:linear-gradient(to bottom,transparent,var(--azul),transparent); }
    .brand-pork { font-family:'Montserrat',sans-serif; font-size:56px; font-weight:700; color:var(--azul); letter-spacing:-2px; line-height:1; }
    .section-title { font-size:28px; font-weight:800; color:var(--gris); letter-spacing:-.5px; }
    .section-subtitle { font-size:14px; color:var(--gris); opacity:.7; margin-top:6px; }
    .header-accent { width:56px; height:3px; background:var(--naranja); border-radius:2px; margin:14px auto 0; }

    .countries-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
    @media(max-width:860px){ .countries-grid{grid-template-columns:repeat(2,1fr);} }
    @media(max-width:540px){ .countries-grid{grid-template-columns:1fr;} }

    /* CARD */
    .country-card { background:white; border-radius:16px; box-shadow:0 4px 20px rgba(31,109,177,.08); overflow:hidden; display:flex; flex-direction:column; transition:transform .22s ease, box-shadow .22s ease; }
    .country-card:hover { transform:translateY(-5px); box-shadow:0 10px 32px rgba(31,109,177,.16); }

    /* Flag strip — colored bg, flag contained */
    .card-flag-wrap { height:130px; flex-shrink:0; position:relative; display:flex; align-items:center; justify-content:center; background:white; }
    .card-flag-bg { display:none; }
    .card-flag { width:160px; height:90px; object-fit:contain; display:block; border-radius:4px; position:relative; z-index:1; transition:transform .3s ease; }
    .country-card:hover .card-flag { transform:scale(1.04); }

    @keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
    .shimmer { background:linear-gradient(90deg,#dce9f7 0%,#c4d8f0 50%,#dce9f7 100%); background-size:200% 100%; animation:shimmer 1.5s infinite; }

    /* Divider strip with country name */
    .card-name-strip { padding:14px 18px 10px; border-bottom:1px solid #f0f4fa; text-align:center; }
    .card-country { font-size:32px; font-weight:600; color:var(--azul); letter-spacing:-.3px; font-family:'League Spartan',sans-serif; line-height:1.1; }
    .card-edition { display:flex; align-items:center; justify-content:center; gap:8px; margin-top:5px; flex-wrap:wrap; }
    .ed-badge { background:var(--azul-claro); color:var(--azul); font-size:10px; font-weight:700; padding:3px 9px; border-radius:20px; text-transform:uppercase; letter-spacing:.5px; }
    .ed-date { font-size:11px; color:var(--naranja); font-weight:600; }

    /* Bottom: thumb + actions */
    .card-bottom { padding:14px 16px 16px; display:flex; align-items:center; gap:14px; }
    .card-thumb { width:54px; height:76px; border-radius:4px; overflow:hidden; background:#dce9f7; flex-shrink:0; box-shadow:0 3px 10px rgba(0,0,0,.15); position:relative; }
    .card-thumb img, .card-thumb canvas { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; transition:opacity .4s; }
    .card-thumb .ph { position:absolute; top:0; left:0; width:100%; height:100%; }
    .card-actions { display:flex; flex-direction:column; gap:7px; flex:1; }
    .btn-ver { width:100%; background:var(--azul); border:none; color:white; padding:8px 0; border-radius:7px; font-size:12px; font-weight:700; cursor:pointer; font-family:'Montserrat',sans-serif; transition:background .2s; }
    .btn-ver:hover { background:#155a96; }
    .btn-dl { width:100%; display:inline-flex; align-items:center; justify-content:center; gap:4px; background:white; border:2px solid var(--naranja); color:var(--naranja); padding:6px 0; border-radius:7px; font-size:12px; font-weight:700; font-family:'Montserrat',sans-serif; transition:all .2s; cursor:pointer; }
    .btn-dl:hover { background:var(--naranja); color:white; }
    .coming-soon { font-size:11px; color:#bbb; font-style:italic; }

    /* MODAL */
    .pdf-modal { display:none; position:fixed; inset:0; background:rgba(12,12,12,.96); z-index:1000; flex-direction:column; align-items:center; padding:16px 20px 20px; gap:14px; }
    .pdf-topbar { width:100%; max-width:1100px; display:flex; align-items:center; gap:16px; flex-shrink:0; }
    .pdf-modal-title { font-size:14px; font-weight:700; color:rgba(255,255,255,.75); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .pdf-page-info { font-size:12px; color:rgba(255,255,255,.45); font-weight:600; min-width:90px; text-align:center; flex-shrink:0; }
    .pdf-close-btn { background:rgba(255,255,255,.1); border:none; width:36px; height:36px; border-radius:50%; cursor:pointer; font-size:14px; color:white; display:flex; align-items:center; justify-content:center; transition:background .2s; flex-shrink:0; }
    .pdf-close-btn:hover { background:#cc3333; }
    .viewer-wrap { flex:1; display:flex; align-items:center; justify-content:center; width:100%; overflow:hidden; gap:0; }
    .side-nav-btn { background:rgba(255,255,255,.08); border:none; width:52px; height:90px; border-radius:10px; cursor:pointer; font-size:32px; color:rgba(255,255,255,.6); display:flex; align-items:center; justify-content:center; transition:background .2s,color .2s; flex-shrink:0; margin:0 14px; }
    .side-nav-btn:hover:not(:disabled) { background:var(--azul); color:white; }
    .side-nav-btn:disabled { opacity:.1; cursor:not-allowed; }

    /* single-page image viewer */
    .img-viewer { max-height:100%; max-width:100%; object-fit:contain; box-shadow:0 24px 80px rgba(0,0,0,.7); border-radius:3px; display:block; }

    /* book (PDF multi-page) */
    .book { display:flex; align-items:stretch; box-shadow:0 24px 80px rgba(0,0,0,.7); position:relative; }
    .page-side { background:white; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .page-L { box-shadow:inset -12px 0 32px rgba(0,0,0,.13); }
    .page-R { box-shadow:inset 12px 0 32px rgba(0,0,0,.08); }
    .page-side canvas { display:block; }
    .book-spine { width:10px; flex-shrink:0; background:linear-gradient(to right,rgba(0,0,0,.32),rgba(0,0,0,.06),rgba(255,255,255,.12),rgba(0,0,0,.06),rgba(0,0,0,.2)); z-index:2; }
  </style>
</helmet>

<div class="page">
  <a class="back-link" id="back-btn" href="">← Volver al Boletín</a>

  <div class="header">
    <div class="brand-row">
      <img class="brand-logo" id="logo-img" alt="333®">
      <div class="brand-divider"></div>
      <div class="brand-pork">Pork Economics</div>
    </div>
    <div class="section-title">Swine Profile</div>
    <div class="header-accent"></div>
  </div>

  <div class="countries-grid" id="countries-grid"></div>
</div>

<div class="pdf-modal" id="pdf-modal">
  <div class="pdf-topbar">
    <div class="pdf-modal-title" id="pdf-modal-title">Swine Profile</div>
    <span class="pdf-page-info" id="pdf-page-info"></span>
    <button class="pdf-close-btn" id="pdf-modal-close">✕</button>
  </div>
  <div class="viewer-wrap" id="viewer-wrap">
    <button class="side-nav-btn" id="pdf-prev" style="visibility:hidden;">&#8249;</button>
    <div id="viewer-content"></div>
    <button class="side-nav-btn" id="pdf-next" style="visibility:hidden;">&#8250;</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    countries: [
      { name:'Brasil',     flag:'https://flagcdn.com/w320/br.png', color:'#74ACDF', edition:6, date:'Junio 2026',      file:'pdfs/profile_brasil_preview.png', type:'img', available:true  },
      { name:'España',     flag:'https://flagcdn.com/w320/es.png', color:'#74ACDF', edition:5, date:'Octubre 2025',    file:'pdfs/profile_espana.png',         type:'img', available:true  },
      { name:'Argentina',  flag:'https://flagcdn.com/w320/ar.png', color:'#74ACDF', edition:4, date:'Marzo 2025',      file:'pdfs/profile_argentina.png',      type:'img', available:true  },
      { name:'Costa Rica', flag:'https://flagcdn.com/w320/cr.png', color:'#74ACDF', edition:3, date:'Septiembre 2024', file:'pdfs/profile_costarica.png',      type:'img', available:true  },
      { name:'Colombia',   flag:'https://flagcdn.com/w320/co.png', color:'#74ACDF', edition:2, date:'Mayo 2024',       file:'pdfs/profile_colombia.png',       type:'img', available:true  },
      { name:'México',     flag:'https://flagcdn.com/w320/mx.png', color:'#74ACDF', edition:1, date:'Enero 2024',      file:'pdfs/profile_mexico.png',         type:'img', available:true  },
    ]
  };

  _pdfDoc = null; _spread = 0; _numSpreads = 0;
  _natW = 595; _natH = 842;
  _curType = 'img';

  getBase    = () => document.baseURI.replace(/[^\/]*(\?.*)?$/, '');
  getFileUrl = (f) => this.getBase() + f;

  /* ── GRID ── */
  renderGrid = () => {
    const grid = document.getElementById('countries-grid');
    if (!grid) return;
    grid.innerHTML = '';
    this.state.countries.forEach(c => {
      const cid = 'thumb-' + c.name.replace(/\s/g,'').toLowerCase();
      const card = document.createElement('div');
      card.className = 'country-card';
      card.innerHTML = `
        <div class="card-flag-wrap">
          <div class="card-flag-bg" style="background:linear-gradient(135deg,${c.color}22,${c.color}55);"></div>
          <img class="card-flag" src="${c.flag}" alt="${c.name}">
        </div>
        <div class="card-name-strip">
          <div class="card-country">${c.name}</div>
          <div class="card-edition">
            <span class="ed-badge">Edición ${c.edition}</span>
            <span class="ed-date">${c.date}</span>
          </div>
        </div>
        <div class="card-bottom">
          <div class="card-thumb">
            <div class="ph shimmer" id="ph-${cid}"></div>
            ${c.type === 'img'
              ? `<img id="${cid}" src="" style="opacity:0;" alt="${c.name}">`
              : `<canvas id="${cid}" style="opacity:0;"></canvas>`}
          </div>
          <div class="card-actions">
            ${c.available
              ? `<button class="btn-ver" id="ver-${cid}">Ver infografía</button>
                 <button class="btn-dl" id="dl-${cid}">↓ Descargar</button>`
              : `<span class="coming-soon">Próximamente</span>`}
          </div>
        </div>`;
      grid.appendChild(card);

      if (c.available) {
        const url = this.getFileUrl(c.file);
        document.getElementById('ver-' + cid).onclick = () =>
          this.openViewer(url, c.type, c.flag + ' ' + c.name + ' · Edición ' + c.edition, c.name);
        document.getElementById('dl-' + cid).onclick = () => {
          const a = document.createElement('a');
          a.href = url; a.download = 'SwineProfile_' + c.name.replace(/\s/g,'_') + (c.type==='img'?'.png':'.pdf');
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
        };
        if (c.type === 'img') this.loadImgThumb(cid, url);
        else this.loadPdfThumb(cid, url);
      }
    });
  };

  /* ── THUMBS ── */
  loadImgThumb = (canvasId, url) => {
    const el = document.getElementById(canvasId);
    if (!el) return;
    el.onload = () => { el.style.opacity = '1'; const ph = document.getElementById('ph-'+canvasId); if(ph) ph.style.display='none'; };
    el.src = url;
  };
  loadPdfThumb = async (canvasId, url) => {
    try {
      if (typeof pdfjsLib === 'undefined') return;
      const pdf  = await pdfjsLib.getDocument(url).promise;
      const page = await pdf.getPage(1);
      const nv   = page.getViewport({ scale:1 });
      const sc   = 62 / nv.width;
      const vp   = page.getViewport({ scale:sc });
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      canvas.width = vp.width; canvas.height = vp.height;
      await page.render({ canvasContext:canvas.getContext('2d'), viewport:vp }).promise;
      canvas.style.opacity = '1';
      const ph = document.getElementById('ph-'+canvasId);
      if (ph) ph.style.display = 'none';
    } catch(e) {}
  };

  /* ── VIEWER ── */
  openViewer = async (url, type, label, country) => {
    const modal = document.getElementById('pdf-modal');
    if (!modal) return;
    document.getElementById('pdf-modal-title').textContent = 'Swine Profile — ' + label;
    document.getElementById('pdf-page-info').textContent = '';
    modal.style.display = 'flex';
    this._curType = type;

    if (type === 'img') {
      document.getElementById('pdf-prev').style.visibility = 'hidden';
      document.getElementById('pdf-next').style.visibility = 'hidden';
      const wrap = document.getElementById('viewer-wrap');
      const content = document.getElementById('viewer-content');
      content.innerHTML = '';
      const img = document.createElement('img');
      img.className = 'img-viewer';
      img.style.maxHeight = (wrap.clientHeight - 20) + 'px';
      img.src = url;
      content.appendChild(img);
    } else {
      document.getElementById('pdf-prev').style.visibility = 'visible';
      document.getElementById('pdf-next').style.visibility = 'visible';
      document.getElementById('pdf-prev').disabled = true;
      document.getElementById('pdf-next').disabled = true;
      document.getElementById('pdf-page-info').textContent = 'Cargando...';
      const content = document.getElementById('viewer-content');
      content.innerHTML = `<div class="book" id="pdf-book">
        <div class="page-side page-L" id="page-L"><canvas id="canvas-L"></canvas></div>
        <div class="book-spine"></div>
        <div class="page-side page-R" id="page-R"><canvas id="canvas-R"></canvas></div>
      </div>`;
      try {
        this._pdfDoc = await pdfjsLib.getDocument(url).promise;
        const p1 = await this._pdfDoc.getPage(1);
        const nv = p1.getViewport({ scale:1 });
        this._natW = nv.width; this._natH = nv.height;
        this._numSpreads = Math.ceil(this._pdfDoc.numPages / 2);
        await this.renderSpread(0);
      } catch(e) {
        document.getElementById('pdf-page-info').textContent = 'No se pudo cargar';
      }
    }
  };

  spreadPages = (s) => {
    if (!this._pdfDoc) return [null,null];
    const n = this._pdfDoc.numPages, L = s*2+1, R = L+1;
    return [L<=n?L:null, R<=n?R:null];
  };
  pageScale = () => {
    const wrap = document.getElementById('viewer-wrap');
    if (!wrap) return 1;
    return Math.min((wrap.clientWidth-180)/(this._natW*2+10),(wrap.clientHeight-30)/this._natH,2.2);
  };
  drawPage = async (canvasId, pageNum, scale) => {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const w=Math.round(this._natW*scale), h=Math.round(this._natH*scale);
    canvas.width=w; canvas.height=h; canvas.style.width=w+'px'; canvas.style.height=h+'px';
    const ctx=canvas.getContext('2d'); ctx.fillStyle='#fafafa'; ctx.fillRect(0,0,w,h);
    if (!pageNum||!this._pdfDoc) return;
    try { const page=await this._pdfDoc.getPage(pageNum); await page.render({canvasContext:ctx,viewport:page.getViewport({scale})}).promise; } catch(e){}
  };
  renderPageToCanvas = async (pageNum, scale) => {
    const c=document.createElement('canvas');
    const w=Math.round(this._natW*scale), h=Math.round(this._natH*scale);
    c.width=w; c.height=h;
    const ctx=c.getContext('2d'); ctx.fillStyle='#fafafa'; ctx.fillRect(0,0,w,h);
    if (pageNum&&this._pdfDoc) { try { const page=await this._pdfDoc.getPage(pageNum); await page.render({canvasContext:ctx,viewport:page.getViewport({scale})}).promise; }catch(e){} }
    return c;
  };
  renderSpread = async (spread) => {
    if (!this._pdfDoc) return;
    this._spread = spread;
    const [L,R] = this.spreadPages(spread);
    const sc = this.pageScale();
    await Promise.all([this.drawPage('canvas-L',L,sc), this.drawPage('canvas-R',R,sc)]);
    const pages=[L,R].filter(Boolean);
    const info=document.getElementById('pdf-page-info');
    if (info) info.textContent = pages.length ? 'Págs. '+pages.join('–')+' / '+this._pdfDoc.numPages : '';
    document.getElementById('pdf-prev').disabled = spread<=0;
    document.getElementById('pdf-next').disabled = spread>=this._numSpreads-1;
  };
  flipToSpread = async (newSpread, dir) => {
    if (!this._pdfDoc) return;
    const sc=this.pageScale();
    const [newL,newR]=this.spreadPages(newSpread);
    const w=Math.round(this._natW*sc), h=Math.round(this._natH*sc);
    const book=document.getElementById('pdf-book');
    const turnCanvas=document.getElementById(dir==='next'?'canvas-R':'canvas-L');
    const frontUrl=turnCanvas.toDataURL();
    const backC=await this.renderPageToCanvas(dir==='next'?newL:newR, sc);
    const backUrl=backC.toDataURL();
    await Promise.all([this.drawPage('canvas-L',newL,sc), this.drawPage('canvas-R',newR,sc)]);
    const bookRect=book.getBoundingClientRect();
    const sideEl=document.getElementById(dir==='next'?'page-R':'page-L');
    const sideRect=sideEl.getBoundingClientRect();
    const oLeft=sideRect.left-bookRect.left;
    const overlay=document.createElement('div');
    overlay.style.cssText=`position:absolute;top:0;left:${oLeft}px;width:${w}px;height:${h}px;perspective:${w*4}px;z-index:20;pointer-events:none;`;
    const flipEl=document.createElement('div');
    flipEl.style.cssText=['width:100%','height:100%','transform-style:preserve-3d',`transform-origin:${dir==='next'?'left':'right'} center`,'transition:transform 0.7s cubic-bezier(0.45,0,0.55,1)'].join(';');
    const mkFace=(url,rot)=>{ const d=document.createElement('div'); d.style.cssText=`position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;${rot?'transform:'+rot+';':''}overflow:hidden;`; const img=document.createElement('img'); img.style.cssText=`width:${w}px;height:${h}px;display:block;`; img.src=url; d.appendChild(img); return d; };
    flipEl.appendChild(mkFace(frontUrl,null));
    flipEl.appendChild(mkFace(backUrl,dir==='next'?'rotateY(180deg)':'rotateY(-180deg)'));
    overlay.appendChild(flipEl); book.appendChild(overlay);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ flipEl.style.transform=dir==='next'?'rotateY(-180deg)':'rotateY(180deg)'; }));
    setTimeout(()=>overlay.remove(), 800);
    this._spread=newSpread;
    const pages=[newL,newR].filter(Boolean);
    const info=document.getElementById('pdf-page-info');
    if (info) info.textContent=pages.length?'Págs. '+pages.join('–')+' / '+this._pdfDoc.numPages:'';
    document.getElementById('pdf-prev').disabled=newSpread<=0;
    document.getElementById('pdf-next').disabled=newSpread>=this._numSpreads-1;
  };
  closeModal = () => {
    const modal=document.getElementById('pdf-modal');
    if (modal) modal.style.display='none';
    this._pdfDoc=null;
  };

  componentDidMount() {
    if (!window.PEAuth || !window.PEAuth.check()) return;
    if (typeof pdfjsLib !== 'undefined')
      pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const logo=document.getElementById('logo-img');
    if (logo) logo.src=this.getBase()+'logo333.png';
    const back=document.getElementById('back-btn');
    if (back) back.href=window.PEAuth.appendToken(this.getBase()+'Inicio.dc.html');
    this.renderGrid();
    document.getElementById('pdf-modal-close').onclick=this.closeModal;
    document.getElementById('pdf-modal').onclick=(e)=>{ if(e.target.id==='pdf-modal') this.closeModal(); };
    document.getElementById('pdf-prev').onclick=()=>{ if(this._pdfDoc&&this._spread>0) this.flipToSpread(this._spread-1,'prev'); };
    document.getElementById('pdf-next').onclick=()=>{ if(this._pdfDoc&&this._spread<this._numSpreads-1) this.flipToSpread(this._spread+1,'next'); };
  }

  renderVals() { return {}; }
}
</script>
</body>
</html>
