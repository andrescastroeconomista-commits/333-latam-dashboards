class Component extends DCLogic {

        country: "Ecuador",
        flagCode: "ec",
        imagePath: "leaders/estefania.jpeg",
        audioUrl: "leaders/audio_estefania.mp4",
        articleDate: "Junio 2026",
        articleTitle: "La soberanía que no exporta",
        preview: "La soberanía alimentaria no se mide por cuánto protegemos un mercado de la competencia internacional, sino por la fortaleza real de nuestra cadena productiva.",
        fullArticle: `<p><strong>LA SOBERANÍA QUE NO EXPORTA</strong></p>
<p>Maíz ecuatoriano: una fortaleza que debe sostenerse con equilibrio y competitividad.</p>
<p>Detrás de cada quintal de maíz ecuatoriano hay familias rurales, generaciones dedicadas al trabajo en el campo y una historia productiva que merece ser reconocida y protegida. Como sector, valoramos profundamente el esfuerzo del productor nacional de maíz, con quien compartimos una misma cadena agroalimentaria, un mismo territorio y el desafío común de fortalecer la producción del país.</p>
<p>Desde esa mirada, no se trata de desconocer la importancia de contar con materia prima nacional ni de restar valor al aporte social y económico que representa el maíz para miles de familias ecuatorianas. Por el contrario, partimos del reconocimiento de esa realidad para plantear, con respeto y responsabilidad, una reflexión que el sector viene sosteniendo desde hace varios años: ¿a qué costo, y por cuánto tiempo más, podemos mantener una política que respondió a un momento específico de nuestra historia agrícola?</p>
<p>Contar con materia prima propia debe ser una fortaleza para el país, siempre que su disponibilidad, calidad y precio permitan a toda la cadena mantenerse competitiva. Sin embargo, cuando el costo de esa materia prima empieza a limitar la capacidad de producir alimentos accesibles, competir en igualdad de condiciones y proyectarnos hacia nuevos mercados, aquello que debería ser una ventaja termina convirtiéndose, sin que nadie lo busque, en una restricción para el desarrollo productivo nacional.</p>
<p><strong>Una política que nació para un momento y se quedó sin revisión</strong></p>
<p>Desde 2015, la industria balanceadora y porcícola compra el maíz nacional a un precio mínimo de sustentación fijado por el Gobierno, hoy en una banda oficial entre 17,35 y 19,50 dólares por quintal. Es una política que, en su momento, buscó dar certeza al productor de maíz, un objetivo legítimo y comprensible. Pero once años después, esa certeza para uno de los actores de la cadena se ha traducido en un sobrecosto de entre 30% y 40% en la producción de carne de cerdo para el resto de la cadena, según estimaciones del propio sector. La importación, además, solo se habilita si productores y Gobierno reconocen formalmente un déficit, y exclusivamente en una ventana de tres meses, de diciembre a febrero.</p>
<p>No desconocemos la intención con la que esta medida fue concebida ni el contexto que en su momento justificó su implementación. Sin embargo, consideramos necesario revisar, con respeto y responsabilidad, si una herramienta creada para responder a una realidad específica puede seguir aplicándose indefinidamente sin mecanismos claros de evaluación, sin metas concretas de mejora productiva y sin una ruta progresiva que permita avanzar hacia un mercado más competitivo y sostenible para toda la cadena.</p>
<p><strong>Un costo que, al final, llega a la mesa de todos</strong></p>
<p>Cuando el maíz cuesta más, ese costo no se queda en la granja. Se traslada, paso a paso, hasta el precio que paga el consumidor por su proteína animal. Y cuando ese precio sube, las familias con presupuestos más ajustados no dejan de comer: ajustan qué comen, y la proteína animal suele ser de lo primero que se reduce.</p>
<p>Esto importa especialmente en un país donde, según el Instituto Nacional de Estadística y Censos, el 19,3% de los niños menores de 2 años vive con desnutrición crónica infantil, una cifra que sube a 23,1% entre los menores de 5 años.</p>
<p><strong>Una cadena que ha crecido y que mira hacia afuera</strong></p>
<p>La porcicultura ecuatoriana no llega a esta conversación con las manos vacías. Hablamos de cerca de 166.000 productores, el 95% de ellos pequeños productores familiares para quienes los cerdos de traspatio son parte de su sustento. El sector genera alrededor de 600 millones de dólares en ventas anuales, representa el 8% del PIB agropecuario y sostiene 200.000 empleos directos y más de 500.000 indirectos, con un crecimiento anual cercano al 6% gracias a la inversión en genética, nutrición animal y tecnificación.</p>
<p>Es, en otras palabras, un sector que ha hecho su tarea. Y por eso mismo nos preguntamos qué tan lejos podríamos llegar si esa misma energía, la que hoy se destina a sostener la viabilidad frente al costo de la materia prima, se concentrara en lo que verdaderamente nos abriría las puertas de otros mercados.</p>
<p><strong>Lo que de verdad nos abre las puertas de la exportación: el estatus sanitario</strong></p>
<p>Aquí está, quizás, el punto más importante de esta reflexión. Exportar carne de cerdo no depende solo de tener costos competitivos: depende, antes que nada, de un estatus sanitario sólido y reconocido internacionalmente. Vigilancia epidemiológica robusta, programas de erradicación de enfermedades como la Peste Porcina Clásica, trazabilidad de origen a destino, certificaciones de bioseguridad en granja y plantas de faenamiento que cumplan estándares de los mercados de destino: ese es el verdadero pasaporte para exportar.</p>
<p>Hoy, buena parte de la energía técnica y financiera del sector se destina a negociar, año a año, la sobrevivencia frente al precio de la materia prima. Es un esfuerzo legítimo, pero también es un esfuerzo que nos resta capacidad para invertir en lo que realmente nos posicionaría como exportadores: protocolos sanitarios, certificaciones y la construcción de la confianza internacional que ningún precio de venta puede comprar por sí solo. Una política de maíz más predecible no es un fin en sí mismo; es la condición que nos permitiría redirigir nuestros esfuerzos hacia donde está el verdadero futuro exportador del sector.</p>
<div class="article-quote">"Sentimos orgullo de nuestra tierra y de quienes la trabajan. Pero el orgullo no debería costarnos la competitividad, ni distraernos del verdadero camino hacia la exportación: nuestro estatus sanitario."<br><br>— Estefanía Loaiza, Directora Ejecutiva de ASPE</div>
<p><strong>El orgullo y la competitividad pueden ir de la mano</strong></p>
<p>La soberanía alimentaria no se mide por cuánto protegemos un mercado de la competencia internacional, sino por la fortaleza real de nuestra cadena productiva: su capacidad de alimentar bien a su propia gente y, cuando las condiciones lo permitan, de mirar también hacia afuera. Tener maíz propio es motivo de orgullo. Que ese orgullo no se convierta, sin proponérnoslo, en la razón por la que nuestra carne de cerdo nunca llegó a cruzar una frontera.</p>
<p>Ecuador tiene tierra, agua, gente y vocación productiva, tanto en el campo del maíz como en la porcicultura. Once años después de iniciada esta política, no proponemos eliminarla de un día para otro: proponemos sentarnos a evaluarla, con los mismos datos y el mismo respeto con el que hoy compartimos esta reflexión.</p>`
      },
      {
        id: 2,
        name: "Mario Garro Zamora",
        position: "Presidente Grupo Zamora",
        country: "Costa Rica",
        flagCode: "cr",
        imagePath: "leaders/mario_garro.jpg",
        audioUrl: "leaders/audio_mario.mp4",
        articleDate: "Octubre 2025",
        articleTitle: "Lo único que tenemos por cierto es la incertidumbre",
        preview: "Como solo tenemos por cierto la incertidumbre, solo va a suceder lo que estemos dispuestos a hacer nosotros por nosotros mismos.",
        fullArticle: `<p><strong>LO ÚNICO QUE TENEMOS POR CIERTO ES LA INCERTIDUMBRE</strong></p>
<p>Hagamos un breve recorrido:</p>
<p>Las impredecibles decisiones de la administración Trump en materia de aranceles y las consecuencias que vendrán en términos de comercio mundial. ¿Y entonces… ahora cuáles son las reglas? China se saca de la manga aranceles a la carne de cerdo de la UE como represalia al impuesto a los vehículos eléctricos argumentando prácticas antidumping. Como consecuencia está la industria porcina española con un signo de pregunta del tamaño de la Basílica de la Sagrada Familia, y, ¿por qué nosotros nos pegamos la rifa, si ni números habíamos comprado?</p>
<p>¿Cuánto durará en llegar la PPA a España? ¿Y cuánto al Continente Americano? ¿Será que llegará? Lo más seguro que quien sabe… Rusia en media guerra hace su transición de importador de carne de cerdo a meterse como jugador a exportar con un potencial enorme para crecer, con granos, fertilizantes, agua, sin exceso de regulaciones y con recursos energéticos a costos ridículamente bajos. ¿Se meterán los rusos en el top 3 de los exportadores porcinos en el corto plazo?</p>
<p>¿Será China en el mediano plazo autosuficiente para abastecer su mercado doméstico? Nada más y nada menos que mayor al 50% del consumo mundial. ¿Tendrá éxito en su apuesta por criar animales en ambientes controlados y aparentemente muy eficientes en edificios de muchos pisos? ¡Qué susto!</p>
<p>¿Seguirán las exitosas empresas españolas de shopping y consolidando alianzas con potenciales jugadores de América Latina en el próximo quinquenio?</p>
<p>En este momento de la historia de nuestra industria mundial, caminamos con una generosa cantidad de interrogantes que hacen reverencia a aquella célebre frase del que en este negocio <em>"el que más sabe, no sabe nada y el más tullido es trapecista"</em>. Perderá el que subestime alguna posibilidad.</p>
<p><strong>Latinoamérica en el centro de la escena</strong></p>
<p>Centrando la mirada en nuestra amada Latam, admiramos por muchos años la pujante industria porcina chilena, en donde un solo jugador, por su tamaño, ha movido la aguja, con políticas públicas que estuvieron muy bien alineadas y comprometidas en impulsar el sector alimentario y particularmente el pecuario, logrando convertir a Chile en un importante proveedor de alimentos para el mundo. Además, hoy miramos el impresionante despertar de los mexicanos, los argentinos, los colombianos y ni que hablar de la potencia en que se han convertido los admirables brasileños que a donde vuelva su mirada hace temblar por sus impresionantes bajos costos de producción y su imponente capacidad de economía de escala.</p>
<p>Pienso que las compañías españolas ya han tomado posición y sí continuarán cruzando el charco consolidando un enorme y fuerte bloque que posicionará a <strong>"Iberoamérica alimentando al mundo"</strong>.</p>
<p>Hace más de 500 años, los españoles llegaron a nuestras tierras trayendo a estas latitudes tesoros de incalculable valor, como la educación, el idioma, la cultura y hasta los primeros cerdos que tocaron suelo americano. Muy probablemente no fue gratis, pero nos dejaron la FE, algo que ni con todo el oro del mundo podríamos pagar.</p>
<p>Si fuera a suceder como estoy intuyendo, que los españoles continuarán acercándose cada día más a Latinoamérica, hay algo que sí debemos estar atentos. Hace más de 5 siglos no sabíamos que no solo cosas buenas traerían a nuestro continente, sino que también otras no deseables como las enfermedades con las que no contábamos en aquella época. Entonces, hoy en día, ¿qué cosas no ocupamos que traiga al continente la muy admirable industria porcina española?</p>
<p>No ocupamos que traigan en sus carabelas el <em>"exceso"</em> de regulaciones que han permitido que les impongan y que algunas (no pocas) rayan por mucho la irracionalidad. Ese paquete de excesos de regulaciones puede quedarse del otro lado del charco y estoy convencido de que no pasará nada de este lado. Porque ya los países latinoamericanos hemos venido implementando regulaciones que quizás, lo que haga falta sea homologarlas, pero nuevamente, sin caer en excesos que hagan imposible la actividad.</p>
<p>Pero la porcicultura Latinoamérica somos más que los países pujantes que miramos con tanta admiración, también está compuesta por países con enormes oportunidades que vamos detrás, haciendo la tarea de ser cada día más eficientes, convenciéndonos que la bioseguridad no es negociable, venimos entendiendo que el bienestar animal, buenas prácticas pecuarias y una buena interpretación de la información confiable en tiempo real no es un juego.</p>
<p>En mis más de 30 años de aprendiz en la industria porcina, me he convencido que el comercio internacional de carne de cerdo es y será siempre de oportunidad y hay que estar siempre preparados en posición para tomarlas cuando llegan y mientras duren. Pero también tengo la certeza que el intercambio comercial es en un altísimo porcentaje un mercado de excedentes, donde el más grande balancea sus excedentes en la mayoría de veces a precios por debajo del verdadero costo.</p>

        fullArticle: `<p><strong>ES EL MOMENTO DE MEJORAR, NO DE CRECER</strong></p>
<p>Un año de optimismo rodea la porcicultura latinoamericana. Si bien no faltan las dificultades por la inestabilidad política en los países de la región, hay razones para pensar que este año será bastante positivo para nuestra porcicultura.</p>

        fullArticle: `<p><strong>LO QUE NOS HACE RESISTENTES ANTE LAS CRISIS</strong></p>
<p>Luego de 40 años en la profesión, no recuerdo haber sufrido una crisis de esta magnitud. No quiero recordarles los factores propios de la pandemia y de sus derivados como la baja de consumo y las elevadas tasas de interés de la mayoría de los bancos centrales del mundo y otros hechos que agravaron la crisis, como las guerras, los problemas logísticos, los cambios políticos aun en curso, los problemas sanitarios pandémicos con especial énfasis en FPA, PED entre otros.</p>
<p>Sin embargo, hay un tema que todos conocemos y que estoy seguro que la mayoría no dimensiona en su totalidad. China, con el 50% de la producción mundial de carne de cerdo, en su intento de controlar la FPA redujo su producción en un porcentaje importante, cuyo déficit fue suplido, en parte, por el resto del mundo, con un procesamiento de la carne muy básico y a un alto precio. Esto hipertrofió la producción del resto del mundo.</p>
<p>Es una realidad que a raíz de la crisis generada por la FPA, China cambió su estrategia de producción, pues reemplazó su alta dependencia de la producción ineficiente de traspatio por una basada en grandes complejos autosuficientes, donde conviven, planta de alimento, producción y rastro. Hoy, con el gigante asiático ya supliendo sus necesidades internas, se genera sobreoferta de carne de cerdo en el mundo y los precios no reaccionan.</p>

  _audio = null;

    this.state.leaders.forEach((leader, idx) => {

      card.className = 'leader-card';
      card.dataset.id = leader.id;
      card.dataset.idx = idx;

      let flagsHtml = `<img class="flag-img" id="flag1-${leader.id}" alt="${leader.country}">`;
      if (leader.flagCode2) flagsHtml += `<img class="flag-img" id="flag2-${leader.id}" alt="">`;

      card.innerHTML = `
        <div class="photo-ring"><img id="photo-${leader.id}" src="" alt="${leader.name}"></div>
        <div class="leader-name">${leader.name}</div>
        <div class="leader-pos">${leader.position}</div>
        <div class="leader-country">${flagsHtml}<span>${leader.country}</span></div>

          <div class="audio-player" id="audioplayer-${leader.id}" title="Cerrar reproductor">
            <div class="audio-row1">
              <button class="btn-replay" id="btnreplay-${leader.id}">&#8635;</button>

              <div style="flex:1;">
                <div class="progress-wrap" id="progwrap-${leader.id}"><div class="progress-bar" id="progbar-${leader.id}"></div></div>
                <div class="audio-times"><span id="acur-${leader.id}">0:00</span><span id="adur-${leader.id}">--:--</span></div>
              </div>
            </div>
            <div class="speed-row">
              <span class="speed-lbl">Velocidad:</span>
              <button class="speed-btn active" data-lid="${leader.id}" data-speed="1">1×</button>
              <button class="speed-btn" data-lid="${leader.id}" data-speed="1.5">1.5×</button>
              <button class="speed-btn" data-lid="${leader.id}" data-speed="2">2×</button>
              <button class="speed-btn" data-lid="${leader.id}" data-speed="2.5">2.5×</button>
            </div>
          </div>
          <button class="btn-read" id="btnread-${leader.id}">Ver artículo completo &#8594;</button>
        </div>`;

      grid.appendChild(card);

      // Load images
      const photoEl = document.getElementById(`photo-${leader.id}`);
      if (photoEl) photoEl.src = base + leader.imagePath;
      const f1 = document.getElementById(`flag1-${leader.id}`);
      if (f1 && leader.flagCode) { f1.src = `https://flagcdn.com/32x24/${leader.flagCode}.png`; f1.style.display = 'inline-block'; }
      if (leader.flagCode2) {
        const f2 = document.getElementById(`flag2-${leader.id}`);
        if (f2) { f2.src = `https://flagcdn.com/32x24/${leader.flagCode2}.png`; f2.style.display = 'inline-block'; }
      }

      // Click on audio player bg → close player and return to button
      document.getElementById(`audioplayer-${leader.id}`).onclick = (e) => {
        // Only close if clicking the background, not inner controls
        if (e.target === e.currentTarget) {
          if (this._audio && this._activeAudioId === leader.id) {
            this._audio.pause(); this._audio.src = ''; this._audio = null;
            this._activeAudioId = null;
          }
          const playerEl = document.getElementById(`audioplayer-${leader.id}`);
          const btnEl = document.getElementById(`btnplay-${leader.id}`);
          if (playerEl) playerEl.style.display = 'none';
          if (btnEl) btnEl.style.display = 'flex';
        }
      };

      // Audio events
      document.getElementById(`btnplay-${leader.id}`).onclick = () => this.startAudio(leader);
      document.getElementById(`btnpp-${leader.id}`).onclick = () => {
        if (!this._audio || this._activeAudioId !== leader.id) return;
        if (this._audio.paused) { this._audio.play(); } else { this._audio.pause(); }
      };
      document.getElementById(`btnreplay-${leader.id}`).onclick = () => {
        if (!this._audio || this._activeAudioId !== leader.id) return;
        this._audio.currentTime = 0; this._audio.play();
      };
      document.getElementById(`progwrap-${leader.id}`).onclick = (e) => {
        if (!this._audio || !this._audio.duration || this._activeAudioId !== leader.id) return;
        const rect = e.currentTarget.getBoundingClientRect();
        this._audio.currentTime = ((e.clientX - rect.left) / rect.width) * this._audio.duration;
      };
      card.querySelectorAll('.speed-btn').forEach(btn => {
        btn.onclick = () => {
          if (this._activeAudioId !== leader.id) return;
          const sp = parseFloat(btn.dataset.speed);
          this._audioSpeeds[leader.id] = sp;
          if (this._audio && this._activeAudioId === leader.id) this._audio.playbackRate = sp;
          card.querySelectorAll('.speed-btn').forEach(b => b.classList.toggle('active', b === btn));
        };
      });

      // Expand
      document.getElementById(`btnread-${leader.id}`).onclick = () => {
        // Block expansion of other articles while audio is playing
        if (this._audio && !this._audio.paused && this._activeAudioId !== leader.id) {
          const btn = document.getElementById(`btnread-${leader.id}`);
          if (btn) {
            btn.style.animation = 'none';
            btn.textContent = 'Solo puedes ver el artículo en reproducción';
            btn.style.borderColor = 'var(--naranja)';
            btn.style.color = 'var(--naranja)';
            setTimeout(() => {
              btn.textContent = 'Ver artículo completo →';
              btn.style.borderColor = '';
              btn.style.color = '';
            }, 2000);
          }
          return;
        }
        this.toggleExpansion(leader, idx);
      };
    });
  };

  toggleExpansion = (leader, idx) => {
    const grid = document.getElementById('leaders-grid');

    // If same leader: close
    if (this._expandedId === leader.id) {
      this.closeExpansion();
      return;
    }

    // Remove existing panel
    const existing = document.getElementById('expansion-panel');
    if (existing) existing.remove();

    this._expandedId = leader.id;
    this._panelLeaderId = leader.id;

    // Determine row (0-indexed, 3 cols)
    const row = Math.floor(idx / 3);
    const base = this.getBase();

    // Build panel
    const panel = document.createElement('div');
    panel.className = 'expansion-panel';
    panel.id = 'expansion-panel';

    const comments = this.state.comments[leader.id] || [];
    panel.innerHTML = `
      <button class="exp-close" id="exp-close-btn">&#10005;</button>
      <div class="exp-inner">
        <div class="exp-sidebar">
          <div class="exp-photo"><img src="${base + leader.imagePath}" alt="${leader.name}" style="width:100%;height:100%;object-fit:cover;display:block;"></div>
          <div class="exp-name">${leader.name}</div>
          <div class="exp-pos">${leader.position}</div>

        <div class="exp-body">

              <button class="c-btn" id="exp-comment-btn">Enviar</button>
            </div>
            <div id="exp-comments-list"></div>
          </div>
        </div>
      </div>`;

    // Insert after last card of the row
    const cards = Array.from(grid.querySelectorAll('.leader-card'));
    const lastInRow = cards[Math.min((row + 1) * 3 - 1, cards.length - 1)];
    lastInRow.after(panel);

    // Highlight active card, de-highlight others
    cards.forEach(c => {
      c.classList.toggle('card-active', parseInt(c.dataset.id) === leader.id);
      const btn = c.querySelector('.btn-read');
      if (btn) btn.classList.toggle('active', parseInt(c.dataset.id) === leader.id);
    });

    // Scroll panel into view
    const panelTop = panel.getBoundingClientRect().top + window.pageYOffset - 24;
    window.scrollTo({ top: panelTop, behavior: 'smooth' });

    // Close btn
    document.getElementById('exp-close-btn').onclick = this.closeExpansion;

    // Comments
    this.renderExpComments(leader.id);
    document.getElementById('exp-comment-btn').onclick = () => {
      const input = document.getElementById('exp-comment-input');
      if (!input || !input.value.trim()) return;
      const newComment = { id: Date.now(), text: input.value.trim(), timestamp: new Date().toLocaleString('es-ES') };
      this.setState({
        comments: { ...this.state.comments, [leader.id]: [...(this.state.comments[leader.id] || []), newComment] }
      }, () => { input.value = ''; this.renderExpComments(leader.id); });
    };
    document.getElementById('exp-comment-input').onkeydown = (e) => {
      if (e.key === 'Enter') document.getElementById('exp-comment-btn').click();
    };
  };

  renderExpComments = (leaderId) => {
    const comments = this.state.comments[leaderId] || [];
    const countEl = document.getElementById('exp-comment-count');
    const listEl = document.getElementById('exp-comments-list');
    if (countEl) countEl.textContent = comments.length;
    if (!listEl) return;
    if (comments.length === 0) {
      listEl.innerHTML = '<div class="c-empty">Sé el primero en comentar</div>';
    } else {
      listEl.innerHTML = comments.map(c => `
        <div class="c-item">
          <div class="c-meta"><strong>Lector</strong> · ${c.timestamp}</div>
          <div class="c-text">${c.text}</div>
        </div>`).join('');
    }
  };

  closeExpansion = () => {
    const panel = document.getElementById('expansion-panel');
    if (panel) panel.remove();
    this._expandedId = null;
    const grid = document.getElementById('leaders-grid');
    if (grid) {
      grid.querySelectorAll('.leader-card').forEach(c => {
        c.classList.remove('card-active');
        const btn = c.querySelector('.btn-read');
        if (btn) btn.classList.remove('active');
      });
    }
  };

  startAudio = (leader) => {
    if (!leader.audioUrl) { alert('El archivo de audio se agregará próximamente.'); return; }
    if (this._activeAudioId && this._activeAudioId !== leader.id) {
      const prev = document.getElementById(`audioplayer-${this._activeAudioId}`);
      const prevBtn = document.getElementById(`btnplay-${this._activeAudioId}`);
      if (prev) prev.style.display = 'none';
      if (prevBtn) prevBtn.style.display = 'flex';
      if (this._audio) { this._audio.pause(); this._audio.src = ''; this._audio = null; }
    }
    const base = this.getBase();
    const audio = new Audio(base + leader.audioUrl);
    this._audio = audio;
    this._activeAudioId = leader.id;
    // Each leader keeps its own speed; default 1x if not set
    const speed = this._audioSpeeds[leader.id] || 1;
    audio.playbackRate = speed;
    audio.addEventListener('loadedmetadata', () => { const el = document.getElementById(`adur-${leader.id}`); if (el) el.textContent = this.fmtTime(audio.duration); });
    audio.addEventListener('timeupdate', () => {
      const bar = document.getElementById(`progbar-${leader.id}`);
      const cur = document.getElementById(`acur-${leader.id}`);
      if (bar && audio.duration) bar.style.width = (audio.currentTime / audio.duration * 100) + '%';
      if (cur) cur.textContent = this.fmtTime(audio.currentTime);
    });
    audio.addEventListener('ended', () => { const bar = document.getElementById(`progbar-${leader.id}`); if (bar) bar.style.width = '0%'; this.updatePPBtn(leader.id); });
    audio.addEventListener('play', () => this.updatePPBtn(leader.id));
    audio.addEventListener('pause', () => this.updatePPBtn(leader.id));
    audio.play();
    const playerEl = document.getElementById(`audioplayer-${leader.id}`);
    const btnEl = document.getElementById(`btnplay-${leader.id}`);
    if (playerEl) playerEl.style.display = 'block';
    if (btnEl) btnEl.style.display = 'none';
    this.updatePPBtn(leader.id);
  };

  updatePPBtn = (lid) => {
    const btn = document.getElementById(`btnpp-${lid}`);
    if (!btn) return;
    btn.innerHTML = (this._audio && !this._audio.paused) ? '&#9646;&#9646;' : '&#9654;';
  };

  componentDidMount() {
    if (!window.PEAuth || !window.PEAuth.check()) return;
    const base = this.getBase();
    const logoEl = document.getElementById('logo-img');
    if (logoEl) logoEl.src = base + 'logo333.png';
    const backBtn = document.getElementById('back-btn');
    if (backBtn) backBtn.href = window.PEAuth.appendToken(base + 'Inicio.dc.html');
    this.renderCards();
  }

  renderVals() { return {}; }
}

</script>
</body>
</html>
